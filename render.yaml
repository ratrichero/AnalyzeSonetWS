services:
  - type: web
    name: crypto-futures-analyzer
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: BOT_MODE
        value: webhook          # ← QUAN TRỌNG
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: CACHE_BACKEND
        value: memory
      - key: USE_API_KEY
        value: "false"
      - key: TELEGRAM_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false